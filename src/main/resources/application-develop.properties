spring.application.name=SavingAndLoanRepaymentTracker
# ==============================
# ==============================
# DATABASE CONFIGURATION (SQL SERVER)
# ==============================
spring.datasource.url=jdbc:sqlserver://10.1.12.110:1433;databaseName=repaymentsdb;encrypt=false
spring.datasource.username=sa
spring.datasource.password=P@ss@12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================
# JPA / HIBERNATE CONFIGURATION
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ============================
#      Allowed  origin
#=============================
application.allowedOrigin= http://localhost:4200,http://10.1.22.72:4510,http://localhost:8085
#constatnt
application.annualInterset=0.07
application.period=10
application.annualPeriod=12
# ==============================
#  JWT CONFIGURATION
# ==============================
application.jwt_secret_key=MzI2Yml0c2VjdXJla2V5MzI2Yml0c2VjdXJla2V5MzI2Yml0c2VjdXJl
# Change this to a long, random string in production
application.jwt_expiration_time=3600000
# 1 hour in milliseconds


server.max-http-request-header-size=20000

# =========================
# MANAGEMENT ENDPOINTS
# =========================
management.endpoints.web.exposure.include=health,info,prometheus

# METRICS
# =========================
management.metrics.tags.application=${spring.application.name}


# TRACING CONFIGURATION
# =========================
management.tracing.sampling.probability=1.0

# OPENTELEMETRY (OTLP)
# =========================
management.opentelemetry.logging.export.otlp.endpoint=http://10.1.12.72:4318/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=http://10.1.12.72:4318/v1/traces

# ==============================
# LOGGING CONFIGURATION
# ==============================
logging.level.org.springframework=INFO
logging.level.com.yourcompany=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%t] %-5level %logger{36} - %msg%n

# ==============================
# SPRING DOC / SWAGGER (optional)
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
