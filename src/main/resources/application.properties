# ==============================
# LOGGING CONFIGURATION
# ==============================
logging.level.org.springframework=INFO
logging.level.com.yourcompany=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%t] %-5level %logger{36} - %msg%n

# =========================
# SERVER CONFIGURATION
# =========================
server.max-http-request-header-size=20000
# =========================
# MANAGEMENT ENDPOINTS
# =========================
# METRICS
# =========================
management.metrics.tags.application=${spring.application.name}
# TRACING CONFIGURATION
# =========================
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
# ==============================
# SPRING DOC / SWAGGER (optional)
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

